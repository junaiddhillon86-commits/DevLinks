<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLinks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-link"></i>
            <span id="D">Dev</span><span id="L">Links</span>
        </div>
    </nav>
    <div class="main">
        <div class="mleft">
            <h1>Preview</h1>
            <div class="nnp">
                <img class="img" src="https://i.pravatar.cc/300" alt="Profile Avatar">
                <div class="lname">
                    <h2>Muhammad Junaid</h2>
                </div>
            </div>

            <div class="links">
                <a href="#" class="link github">GitHub</a>
                <a href="#" class="link linkedin">LinkedIn</a>
                <a href="#" class="link portfolio">Portfolio</a>
                <a href="#" class="link twitter">Twitter</a>
            </div>


        </div>

       <div class="rmain">

    <h1>Editor</h1>

    <div class="section">

        <h2>Profile Details</h2>
        <p>Customize your personal information.</p>

        <label>Profile Picture</label>
        <input type="file">

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Bio</label>
        <textarea placeholder="Tell us about yourself"></textarea>

    </div>

    <div class="section">

        <h2>Links</h2>

        <label>GitHub</label>
        <input type="url" placeholder="https://github.com/">

        <label>LinkedIn</label>
        <input type="url" placeholder="https://linkedin.com/in/">

        <label>Portfolio</label>
        <input type="url" placeholder="https://">

        <button class="add-btn">+ Add New Link</button>

    </div>

    <div class="section">

        <h2>Appearance</h2>

        <div class="theme-box">

            <button class="theme-btn">Dark</button>
            <button class="theme-btn">Light</button>

        </div>

    </div>

    <button class="save-btn">Save Profile</button>

</div>
    </div>

    <footer class="f">
        &copy;Made By M jUNAID DHILLON❤️
    </footer>
</body>

</html>
